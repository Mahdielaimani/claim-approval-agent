# Provider equivalence, not prompt A/B testing. In normal operation the first provider
# always answers, so the Groq -> OpenAI -> Gemini fallback is never exercised. This forces
# all three through the same prompts.
#
# Run:  PROMPTFOO_REQUEST_TIMEOUT_MS=20000 npx promptfoo@latest eval -c evaluation/promptfoo.yaml
# View: npx promptfoo@latest view
#
# The timeout is not optional: promptfoo defaults to 300 s with four retries, so one dead
# key turns a two-minute run into half an hour. 20 s matches generation.timeout_seconds.
#
# Prompts render through the real Jinja2 environment via render_prompt.py. Promptfoo's own
# templating is Nunjucks and diverges (`claim.items()` breaks), which would test two
# template engines instead of three providers.

description: Groq, OpenAI and Gemini must produce interchangeable explanations

prompts:
  - id: file://render_prompt.py:render
    label: production-prompt

providers:
  - id: groq:llama-3.3-70b-versatile
    label: groq (primary)
    config: &generation
      temperature: 0.1
      max_tokens: 1024
      response_format: { type: json_object }
  - id: openai:gpt-4o-mini
    label: openai (fallback 1)
    config: *generation
  - id: google:gemini-2.0-flash
    label: gemini (fallback 2)
    config: *generation

# Only genuinely universal rules belong here. Naming SHAP or the algorithm is a leak for a
# customer and a requirement for an auditor, so those assertions live in the customer test.
defaultTest:
  assert:
    - type: is-json
    # The claim under test is routed for review, so a provider that states an outcome is
    # unusable, not merely lower quality.
    - type: not-icontains
      value: was declined
    - type: not-icontains
      value: has been rejected
    - type: latency
      threshold: 8000

tests:
  - description: customer — plain language, no internals
    vars:
      persona: customer
    assert:
      - type: is-json
        value:
          type: object
          required: [summary, key_factors, next_steps]
          properties:
            summary: { type: string, minLength: 40 }
            key_factors: { type: array, minItems: 1, maxItems: 4, items: { type: string } }
            next_steps: { type: array, minItems: 1, maxItems: 3, items: { type: string } }
          additionalProperties: false
      # A subset of customer_blocklist in configs/llm.yaml — the runtime OutputValidator
      # enforces all 22. These are the terms a provider is most likely to volunteer.
      - type: not-icontains
        value: shap
      - type: not-icontains
        value: random forest
      - type: not-icontains
        value: threshold
      - type: not-icontains
        value: probability
      - type: not-icontains
        value: "0.3015"

  - description: adjuster — attribution and review notes
    vars:
      persona: adjuster
    assert:
      - type: is-json
        value:
          type: object
          required: [summary, key_factors, risk_assessment, review_notes]
          properties:
            summary: { type: string }
            key_factors: { type: array, minItems: 1, items: { type: string } }
            risk_assessment: { type: string }
            review_notes: { type: string }
          additionalProperties: false

  - description: auditor — provenance must be reproduced verbatim
    vars:
      persona: auditor
    assert:
      - type: is-json
        value:
          type: object
          required: [summary, key_factors, provenance_record, human_oversight, limitations]
          properties:
            summary: { type: string }
            key_factors: { type: array, minItems: 1, maxItems: 8, items: { type: string } }
            provenance_record: { type: string }
            human_oversight: { type: string }
            limitations: { type: string }
          additionalProperties: false
      # Copied from context, never generated: a paraphrased model version produces an
      # audit trail that does not match the registry.
      - type: contains
        value: random_forest
      - type: contains
        value: v1.0.0
