[tool.ruff]
# 100 rather than the 88 default: the comment convention caps at 100, and the data
# pipeline's column names are long enough that 88 forces unhelpful wrapping.
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = [
    "E501",   # line length is enforced by the formatter, not the linter
    "B008",   # FastAPI's Depends() in defaults is the framework's own idiom
]

[tool.ruff.lint.isort]
# Declared explicitly because the local MLflow store is a directory named `mlflow/`. Without
# this, ruff classifies the import as first-party on a developer machine and third-party on a
# clean checkout, so import order — and the CI result — depends on a gitignored folder.
known-third-party = ["mlflow"]

[tool.ruff.lint.per-file-ignores]
# Private helpers are exercised directly to test one derivation step in isolation.
"tests/*" = ["SLF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# List form, not a string: pytest splits a string addopts with shlex in non-POSIX mode on
# Windows, which keeps the quotes and silently fails to deselect anything.
# llm_eval is opt-in because real provider calls cost money, take seconds, and are graded
# by a judge that is itself sampled — run it before a release, not on every commit.
addopts = ["-q", "--strict-markers", "-m", "not llm_eval"]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "llm_eval: semantic evaluation that calls live LLM providers",
    "integration: exercises more than one layer",
]
filterwarnings = ["ignore::DeprecationWarning:pkg_resources.*"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
