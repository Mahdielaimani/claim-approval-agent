[tool.ruff]
# 100 rather than 88: the data pipeline's column names force unhelpful wrapping at 88.
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = [
    "E501",   # line length is enforced by the formatter, not the linter
    "B008",   # FastAPI's Depends() in defaults is the framework's own idiom
]

[tool.ruff.lint.isort]
# The local MLflow store is a directory named `mlflow/`, so without this ruff classifies the
# import as first-party locally and third-party on a clean checkout — CI depends on a
# gitignored folder.
known-third-party = ["mlflow"]

[tool.ruff.lint.per-file-ignores]
# Private helpers are exercised directly to test one derivation step in isolation.
"tests/*" = ["SLF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# List form, not a string: on Windows pytest shlex-splits a string addopts in non-POSIX
# mode, keeps the quotes, and silently deselects nothing.
# llm_eval is opt-in — real provider calls cost money and are graded by a sampled judge.
addopts = ["-q", "--strict-markers", "-m", "not llm_eval"]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "llm_eval: semantic evaluation that calls live LLM providers",
    "integration: exercises more than one layer",
]
filterwarnings = ["ignore::DeprecationWarning:pkg_resources.*"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
