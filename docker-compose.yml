# Local run of the serving stack. Production targets ECS Fargate — see DESIGN.md — so this
# file exists to make the container reproducible on a laptop, not to describe a deployment.
#
#   docker compose up --build              api only
#   docker compose --profile tracking up   api + the MLflow UI on :5000

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: claim-approval-agent:latest
    container_name: claim-approval-api
    ports:
      - "${PORT:-8000}:8000"

    # Optional: with no file and no keys the client runs in mock mode, which is a valid way
    # to demonstrate the API. A hard requirement here would break a clone-and-run.
    env_file:
      - path: .env
        required: false

    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Overrides the .env value, which points at a Windows path outside the container.
      MLFLOW_TRACKING_URI: /app/mlflow

    volumes:
      # Read-only: the API loads the model and never writes it. A container that can
      # overwrite its own model is one bug away from an unauditable decision.
      - ./artifacts/models:/app/artifacts/models:ro
      # Writable, and named rather than bind-mounted: the cost ledger must survive a
      # restart, which is the whole reason it is a file and not a counter.
      - llm_ledger:/app/artifacts/reports

    restart: unless-stopped

    # Inherited from the Dockerfile, but declared here so `depends_on: condition:
    # service_healthy` works for anything added later.
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    # SHAP and the model hold a few hundred MB; the cap turns a leak into a restart rather
    # than a laptop that stops responding.
    deploy:
      resources:
        limits:
          memory: 2G

    security_opt:
      - no-new-privileges:true

  mlflow:
    # Behind a profile: the UI is for showing experiment history in the demo, and nothing
    # in the serving path depends on it.
    profiles: [tracking]
    image: python:3.12-slim
    container_name: claim-approval-mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow:/mlflow
    working_dir: /mlflow
    command: >
      sh -c "pip install --quiet mlflow==2.19.0 &&
             mlflow server --host 0.0.0.0 --port 5000
             --backend-store-uri file:///mlflow
             --default-artifact-root file:///mlflow"

volumes:
  llm_ledger:
