# GenAI / LLM configuration. Consumed by src/genai/.
# All provider access goes through LiteLLM so a provider change is a config
# change, never a code change.

# An ordered chain, not a primary/fallback pair. Each entry is tried in turn; one with
# no key configured is skipped rather than counted as a failure.
#
# Three separate vendors on purpose. A fallback that shares infrastructure with the
# primary is not a fallback — a single outage would take both down. Groq, OpenAI and
# Google have nothing in common but the LiteLLM interface in front of them.
#
# Changing the order, or adding a fourth vendor, is an edit to this list. No code
# changes, which is the entire reason LiteLLM is in the stack.
providers:
  - name: groq
    model: groq/llama-3.3-70b-versatile
    api_key_env: GROQ_API_KEY
    # First because it is free and fast. Llama 3.3 70B holds the persona constraints
    # and the JSON schema reliably at temperature 0.1.
  - name: openai
    model: gpt-4o-mini
    api_key_env: OPENAI_API_KEY
    # Strongest structured-JSON adherence of the three. The pipeline depends on schema
    # compliance far more than on prose quality.
  - name: gemini
    model: gemini/gemini-2.0-flash
    api_key_env: GEMINI_API_KEY

generation:
  temperature: 0.1        # near-deterministic; comparable claims must get
                          # comparable explanations. Creative variance is a
                          # defect here, not a feature.
  max_tokens: 1024
  timeout_seconds: 20
  num_retries: 2
  # LiteLLM switches to the fallback automatically on these conditions.
  fallback_on: [timeout, rate_limit, api_error, content_filter]

mock_mode:
  # Active when no provider key is set. Returns deterministic structured JSON so
  # tests and CI run with no network and no cost.
  enabled_when_no_api_key: true

prompts:
  template_dir: ./prompts
  version: v1.0.0
  templates:
    customer: customer.jinja2
    adjuster: adjuster.jinja2
    auditor:  auditor.jinja2
  system: system.jinja2

personas:
  customer:
    top_n_shap: 5
    show_score: false           # a probability tells a customer nothing useful
                                # and invites argument about the number
    show_shap_values: false
    show_next_steps: true
    show_risk_flags: false
    include_issue_desc: false
    reading_level: simple
    tone: empathetic, clear, non-accusatory
  adjuster:
    top_n_shap: 10
    show_score: true
    show_shap_values: true
    show_next_steps: false
    show_risk_flags: true
    include_issue_desc: true
    tone: professional, factual, analytical
  auditor:
    top_n_shap: 15
    show_score: true
    show_shap_values: true
    show_next_steps: false
    show_risk_flags: true
    include_issue_desc: true
    require_versions: true      # model version, prompt version, data lineage
    tone: formal, compliance-oriented

validation:
  # Runs on every LLM response before it leaves the service. The prompt asks; this
  # enforces. Measured on 2026-07-29: with a system prompt explicitly forbidding it,
  # Llama 3.3 still wrote "the claim was declined" about a straight-through candidate.
  # An instruction is not a guarantee.
  require_json: true
  strip_markdown_fences: true
  # Per persona, because each template asks for a different schema.
  required_fields:
    customer: [summary, key_factors, next_steps]
    adjuster: [summary, key_factors, risk_assessment, review_notes]
    auditor: [summary, key_factors, provenance_record, human_oversight, limitations]
  # Terms that must never reach a customer response. Model names are listed because a
  # leaked algorithm name is a disclosure, and the winner changed once already.
  customer_blocklist:
    [shap, shapley, probability, confidence score, model predicts, threshold,
     random forest, xgboost, catboost, lightgbm, llama, gpt, gemini, groq,
     feature importance, classifier, training data, base rate, attribution,
     algorithm, machine learning, decline risk score]
  # Wording that asserts an outcome the decision record does not support.
  forbidden_everywhere: [auto-approved, automatically approved, auto-declined]
  check_sentiment_consistency: true
  check_numeric_grounding: true
  # Numbers below this magnitude are treated as prose ("two factors", "step 3") rather
  # than as statistics, so grounding does not fire on ordinary counting.
  grounding_min_magnitude: 10.0
  grounding_tolerance: 0.01
  max_retries_on_failure: 1

observability:
  langfuse:
    enabled_when_keys_present: true
    trace_name: claim-explanation
    capture: [prompt, response, model, tokens, cost, latency, persona, error]

evaluation:
  deepeval:
    metrics: [faithfulness, answer_relevancy, hallucination]
    thresholds:
      faithfulness: 0.80
      answer_relevancy: 0.75
      hallucination: 0.20    # lower is better
  promptfoo:
    # Scoped deliberately: not prompt A/B, but proof that the fallback provider
    # behaves like the primary. An unvalidated fallback is untested code sitting
    # on the critical path.
    purpose: provider_equivalence
    config: ./evaluation/promptfoo.yaml
