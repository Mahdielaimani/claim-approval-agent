# GenAI / LLM configuration. Consumed by src/genai/.
# All provider access goes through LiteLLM, so a provider change is a config change.


providers:
  - name: groq
    model: groq/llama-3.3-70b-versatile
    api_key_env: GROQ_API_KEY   # free and fast; holds the schema at temperature 0.1
 
  - name: groq_reserve_2
    model: groq/llama-3.3-70b-versatile
    api_key_env: GROQ_API_KEY_2
  - name: groq_reserve_3
    model: groq/llama-3.3-70b-versatile
    api_key_env: GROQ_API_KEY_3
  - name: openai
    model: gpt-4o-mini
    api_key_env: OPENAI_API_KEY  # strongest structured-JSON adherence of the three
  - name: gemini
    model: gemini/gemini-2.0-flash
    api_key_env: GEMINI_API_KEY

generation:
  temperature: 0.1        # comparable claims must get comparable explanations
  max_tokens: 1024
  timeout_seconds: 20
  num_retries: 2
  fallback_on: [timeout, rate_limit, api_error, content_filter]

mock_mode:
  enabled_when_no_api_key: true   # deterministic JSON, so CI runs with no network or cost

prompts:
  template_dir: ./prompts
  version: v1.0.0
  templates:
    customer: customer.jinja2
    adjuster: adjuster.jinja2
    auditor:  auditor.jinja2
  system: system.jinja2

personas:
  customer:
    top_n_shap: 5
    show_score: false           # a probability tells a customer nothing and invites argument
    show_shap_values: false
    show_next_steps: true
    show_risk_flags: false
    include_issue_desc: false
    reading_level: simple
    tone: empathetic, clear, non-accusatory
  adjuster:
    top_n_shap: 10
    show_score: true
    show_shap_values: true
    show_next_steps: false
    show_risk_flags: true
    include_issue_desc: true
    tone: professional, factual, analytical
  auditor:
    top_n_shap: 15
    show_score: true
    show_shap_values: true
    show_next_steps: false
    show_risk_flags: true
    include_issue_desc: true
    require_versions: true      # model version, prompt version, data lineage
    tone: formal, compliance-oriented

validation:
  # The prompt asks; this enforces. Measured 2026-07-29: with a system prompt forbidding it,
  # Llama 3.3 still wrote "the claim was declined" about a straight-through candidate.
  require_json: true
  strip_markdown_fences: true
  required_fields:
    customer: [summary, key_factors, next_steps]
    adjuster: [summary, key_factors, risk_assessment, review_notes]
    auditor: [summary, key_factors, provenance_record, human_oversight, limitations]
  # Model names included: a leaked algorithm name is a disclosure.
  customer_blocklist:
    [shap, shapley, probability, confidence score, model predicts, threshold,
     random forest, xgboost, catboost, lightgbm, llama, gpt, gemini, groq,
     feature importance, classifier, training data, base rate, attribution,
     algorithm, machine learning, decline risk score]
  forbidden_everywhere: [auto-approved, automatically approved, auto-declined]
  check_sentiment_consistency: true
  check_numeric_grounding: true
  # Below this magnitude a number is prose ("two factors", "step 3"), not a statistic.
  grounding_min_magnitude: 10.0
  grounding_tolerance: 0.01
  max_retries_on_failure: 1

observability:
  langfuse:
    enabled_when_keys_present: true
    trace_name: claim-explanation
    capture: [prompt, response, model, tokens, cost, latency, persona, error]

evaluation:
  deepeval:
    metrics: [faithfulness, answer_relevancy, hallucination, persona_adherence]
    thresholds:
      faithfulness: 0.80
      answer_relevancy: 0.75
      hallucination: 0.20    # lower is better
      persona_adherence: 0.70
  promptfoo:
    # Not prompt A/B: proof that the fallback provider behaves like the primary.
    purpose: provider_equivalence
    config: ./evaluation/promptfoo.yaml
