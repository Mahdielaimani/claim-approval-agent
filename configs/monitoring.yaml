# Post-deployment monitoring. Consumed by src/monitoring/.

drift:
  
  thresholds:
    watch: 0.10
    alarm: 0.20

  n_bins: 10        # at 2880 rows, finer bins would measure sampling noise
  min_rows: 200     # PSI is a ratio of proportions; a small batch inflates it

  ignore:
    - issue_desc_length          # moves with language mix, not risk
    - issue_desc_word_count

  monitor_prediction_distribution: true   # features can stay in range while the score shifts

llm:
  monthly_budget_usd: 20.0
  alert_at_budget_fraction: 0.80
  fallback_rate_alarm: 0.10       # earliest sign the primary provider is degrading
  template_fallback_alarm: 0.01   # no LLM answered at all — an incident, not a metric
  latency_p95_ms: 5000
