# API and Human-in-the-Loop configuration. Consumed by src/api/.

service:
  title: GenAI-Powered Claim Approval Agent
  version: 0.1.0
  host: 0.0.0.0
  port: 8000
  cors_origins: ["*"]      # development only

endpoints:
  predict:
    path: /api/v1/predict
    latency_target_ms: 200   # no LLM call on this path
  explain:
    path: /api/v1/explain
    latency_target_ms: 5000  # prediction + SHAP + LLM
  health:
    path: /api/v1/health

decision_layer:
  decline_threshold: 0.50    # placeholder; replaced by the cross-validated threshold

  hitl:
    enabled: true
    thresholds:
      # score = P(Declined). Bands and rationale: DESIGN.md §7.
      straight_through_below: 0.30
      human_review_above: 0.30
      mandatory_review_above: 0.70
    never_auto_decline: true
    force_review_when:
      - claim_type: Theft            # 20.4% decline rate on 98 claims
      - policy_status: Grace Period  # 28.6% on 28 claims — too thin to automate
      - rrp_eur_above: 2500
      - diag_completeness_below: 3

middleware:
  request_id: true
  structured_logging: true
  log_pii: false             # issueDesc is hashed, never logged in the clear
  rate_limit:
    predict_per_minute: 100  # in-process
    explain_per_minute: 20   # metered by the LLM provider
  auth:
    header: X-API-Key
    exempt_paths: [/api/v1/health, /docs, /openapi.json, /redoc]

errors:
  # A provider failure degrades the explanation, never the decision.
  llm_failure_returns_prediction: true
  fallback_explanation: template
