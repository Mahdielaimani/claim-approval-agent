# Training pipeline configuration. Consumed by src/training/.

data:
  path: ./data/claim_use_case_dataset.xlsx
  target_column: status
  positive_class: Declined
  random_state: 42

currency:
  # SE is SEK, NL and FI are EUR. Uncorrected this is country leakage. Rate from median
  # ratios (rrp 10.35, excessFee 10.49, balanceRRP 10.36). DESIGN.md §4.1.
  base_currency: EUR
  sek_to_eur_rate: 10.3
  countries_in_sek: [SE]
  columns: [rrp, excessFee, balanceRRP]

cleaning:
  drop_constant: [deviceCost, relationship, make]
  drop_duplicate: [oldBalanceRRP]                   # bit-identical to balanceRRP
  drop_degenerate: [smashed, frontOrBackCamera]     # single value plus 65% missing
  drop_redundant_text: [productDesc]
  hold_out_text: [issueDesc, other]                 # routed to the LLM, not the model

  date_columns: [policyStartDate, policyEndDate, purchaseDate]
  date_parse:
    format: mixed              # the file contains both ISO datetimes and DD/MM/YYYY
    dayfirst: true

missing_values:
  # Missing not-at-random: absence reflects the intake channel. 0 would assert
  # "tested, found broken"; -1 keeps "never assessed".
  diagnostic_sentinel: -1
  diagnostic_columns:
    [turnOnOff, touchScreen, frontCamera, backCamera, audio, mic,
     buttons, connection, charging]
  categorical_fill: UNKNOWN
  categorical_columns: [deviceType, retailerName, productCode]
  numeric_strategy: median_by_productCode
  numeric_columns: [excessFee]

features:
  ratios:                        # currency-invariant, so they survive an imperfect FX rate
    - fee_to_rrp_ratio
    - balance_ratio
    - remaining_balance_ratio
  derived_dates:
    - policy_duration_days
    - days_purchase_to_policy
  diagnostic_meta:
    - diag_completeness
    - diag_ones                  # polarity undocumented, so the two are counted separately
    - diag_zeros
  product_name_derived:
    - contract_duration_months   # absent from every other column
    - is_mandatory_policy
    - payment_mode
    - device_type_parsed         # fills deviceType: 48.4% missing -> 0%
  text_meta:
    - issue_desc_length          # metadata only; the narrative goes to the LLM
    - issue_desc_word_count
  frequency_encoded: [model, productCode, retailerName]
  label_encoded: [claimType, coverage, country, channel, policyStatus, deviceType]
  keep_absolute_amounts: true    # pruned later only if SHAP shows the ratios suffice

split:
  strategy: stratified_kfold
  n_folds: 5
  test_size: 0.2

models:
  candidates:                    # identical folds, so the rejections rest on measurement
    - logistic_regression
    - random_forest
    - xgboost
    - catboost
    - lightgbm
    - mlp
  imbalance:
    scale_pos_weight: 5.36       # 2427 Completed / 453 Declined
    catboost: Balanced
    sklearn_class_weight: balanced
    mlp_resampling: smote

tuning:
  library: optuna
  # F1 inside a trial needs a threshold fitted on training predictions, which tree models
  # separate almost perfectly. 20 trials, Random Forest: F1 0.336 -> 0.317, PR-AUC -> 0.344.
  optimize_metric: pr_auc
  direction: maximize
  n_trials: 50
  tune_top_n: 3
  pruner: median

evaluation:
  metrics: [f1_declined, precision_declined, recall_declined, roc_auc, pr_auc]
  threshold_search: true         # inside CV folds; one tuned on all data does not transfer
  threshold_range: [0.05, 0.95]
  threshold_step: 0.01

mlflow:
  tracking_uri: ./mlflow
  experiment_name: claim-approval-agent
  register_model: true
  model_name: claim-approval-model   # algorithm-agnostic: Random Forest won, not XGBoost
